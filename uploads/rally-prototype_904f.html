<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="rally - a live campus map prototype for Texas Tech University.">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Rally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --lime:#a8dc6f;
    --pistachio:#b2d98b;
    --jade:#2e8b6f;
    --eucalyptus:#1d685d;
    --deep:#0f5c4c;
    --ink:#0b1f18;
    --muted:#62786d;
    --faint:#8ba093;
    --page:#f6faf3;
    --white:#ffffff;
    --line:#e2ebdc;
    --line-soft:#eef4ea;
    --ground:#eaf3e4;
    --park:#d8ebc4;
    --bldg:#dce7d5;
    --bldg-line:#cbdac2;
    --grad:linear-gradient(135deg,#a8dc6f 0%,#2e8b6f 52%,#0f5c4c 100%);
    --shadow-sm:0 1px 2px rgba(11,31,24,.06),0 2px 8px rgba(11,31,24,.05);
    --shadow-md:0 4px 14px rgba(11,31,24,.09),0 1px 3px rgba(11,31,24,.06);
    --shadow-pin:0 3px 10px rgba(15,92,76,.28);
    --r-lg:20px;
    --r-md:14px;
    --r-sm:10px;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2.5px solid var(--jade);outline-offset:2px;border-radius:6px}

  .shell{
    max-width:1440px;
    margin:0 auto;
    padding-inline:16px;
    padding-block:16px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:"Baloo 2",system-ui,sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1;
    letter-spacing:-.5px;
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    padding-right:2px;
  }
  .campus{
    display:flex;align-items:center;gap:7px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px 6px 10px;
    font-size:13.5px;
    font-weight:600;
    color:var(--eucalyptus);
    box-shadow:var(--shadow-sm);
  }
  .campus svg{width:15px;height:15px;flex:none}
  .spacer{flex:1}
  .demo-chip{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--line-soft);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 11px;
  }
  .me{
    width:36px;height:36px;border-radius:50%;
    background:var(--grad);
    color:#fff;
    display:grid;place-items:center;
    font-weight:700;font-size:13px;
    box-shadow:var(--shadow-sm);
  }

  /* ---------- filters ---------- */
  .filters{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .seg{
    display:flex;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    box-shadow:var(--shadow-sm);
  }
  .seg button{
    border:0;background:transparent;
    padding:7px 15px;
    border-radius:999px;
    font-size:13.5px;font-weight:600;
    color:var(--muted);
    display:flex;align-items:center;gap:6px;
    transition:background .16s,color .16s;
  }
  .seg button:hover{color:var(--eucalyptus)}
  .seg button[aria-pressed="true"]{
    background:var(--eucalyptus);
    color:#fff;
  }
  .seg .livedot{
    width:7px;height:7px;border-radius:50%;
    background:var(--jade);
    flex:none;
  }
  .seg button[aria-pressed="true"] .livedot{background:var(--lime)}

  .cats{
    display:flex;gap:7px;flex-wrap:wrap;
  }
  .cat{
    border:1px solid var(--line);
    background:var(--white);
    border-radius:999px;
    padding:6px 13px 6px 9px;
    font-size:13px;font-weight:600;
    color:var(--muted);
    display:flex;align-items:center;gap:6px;
    box-shadow:var(--shadow-sm);
    transition:border-color .16s,color .16s,background .16s;
  }
  .cat svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .cat:hover{color:var(--eucalyptus);border-color:var(--pistachio)}
  .cat[aria-pressed="true"]{
    background:var(--pistachio);
    border-color:var(--pistachio);
    color:var(--ink);
  }

  /* ---------- body grid ---------- */
  .body{
    display:grid;
    grid-template-columns:minmax(0,1fr) 384px;
    gap:14px;
    align-items:start;
    flex:1;
  }

  /* ---------- map ---------- */
  .mapwrap{
    background:var(--ground);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    overflow:hidden;
    position:relative;
    display:grid;
    place-items:center;
    box-shadow:var(--shadow-sm);
  }
  .canvas{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
  }
  .canvas svg.base{position:absolute;inset:0;width:100%;height:100%;display:block}

  .pin{
    position:absolute;
    transform:translate(-50%,-50%);
    border:0;background:transparent;padding:0;
    width:44px;height:44px;
    display:grid;place-items:center;
    z-index:2;
  }
  .pin .body-shape{
    width:36px;height:36px;
    border-radius:13px 13px 13px 5px;
    rotate:-45deg;
    display:grid;place-items:center;
    box-shadow:var(--shadow-pin);
    transition:transform .18s cubic-bezier(.34,1.4,.5,1),box-shadow .18s;
    position:relative;
  }
  .pin .body-shape svg{rotate:45deg;width:17px;height:17px;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .pin.live .body-shape{background:var(--grad);color:#fff;border:2px solid #fff}
  .pin.later .body-shape{background:var(--white);color:var(--eucalyptus);border:2px solid var(--eucalyptus)}
  .pin.official .body-shape::after{
    content:"";position:absolute;inset:-6px;
    border-radius:19px 19px 19px 8px;
    border:2px solid var(--jade);
    opacity:.45;
  }
  .pin:hover .body-shape{transform:scale(1.1)}
  .pin[aria-pressed="true"] .body-shape{
    transform:scale(1.22);
    box-shadow:0 6px 20px rgba(15,92,76,.4);
  }
  .pin .count{
    position:absolute;
    right:-1px;bottom:-1px;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:999px;
    min-width:21px;
    padding:1px 5px;
    font-size:10.5px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    line-height:1.5;
    box-shadow:var(--shadow-sm);
    z-index:3;
  }
  .pulse{
    position:absolute;
    width:36px;height:36px;border-radius:50%;
    background:var(--jade);
    opacity:.3;
    animation:pulse 2.4s ease-out infinite;
    z-index:0;
  }
  @keyframes pulse{
    0%{transform:scale(.7);opacity:.34}
    70%{transform:scale(1.9);opacity:0}
    100%{transform:scale(1.9);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    .pulse{animation:none;opacity:.16}
    *{transition-duration:.01ms !important}
  }

  .legend{
    position:absolute;
    left:14px;bottom:14px;
    background:rgba(255,255,255,.94);
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:10px 13px;
    display:flex;flex-direction:column;gap:7px;
    font-size:12px;font-weight:600;color:var(--muted);
    box-shadow:var(--shadow-sm);
    z-index:4;
  }
  .legend div{display:flex;align-items:center;gap:8px}
  .lg-live{width:13px;height:13px;border-radius:5px 5px 5px 2px;rotate:-45deg;background:var(--grad);flex:none}
  .lg-later{width:13px;height:13px;border-radius:5px 5px 5px 2px;rotate:-45deg;background:#fff;border:1.5px solid var(--eucalyptus);flex:none}
  .lg-ring{width:13px;height:13px;border-radius:50%;border:2px solid var(--jade);opacity:.6;flex:none}

  /* ---------- rail ---------- */
  .rail{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
    display:flex;flex-direction:column;
    max-height:calc(100vh - 190px);
    position:sticky;
    top:16px;
  }
  .rail-head{
    padding:15px 17px 13px;
    border-bottom:1px solid var(--line-soft);
    display:flex;align-items:baseline;gap:8px;
  }
  .rail-head h2{
    margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;
    font-family:"Baloo 2",system-ui,sans-serif;
  }
  .rail-head span{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
  .rail-scroll{overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:9px}

  .card{
    text-align:left;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:var(--r-md);
    padding:12px 13px;
    display:flex;flex-direction:column;gap:8px;
    transition:border-color .16s,box-shadow .16s,transform .16s;
    width:100%;
  }
  .card:hover{border-color:var(--pistachio);box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .card[aria-pressed="true"]{border-color:var(--jade);box-shadow:0 0 0 2px rgba(46,139,111,.16)}
  .card-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .card-meta{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .card-meta b{font-weight:600;color:var(--eucalyptus)}
  .dot-sep{color:var(--line);font-weight:700}

  .tag{
    font-size:10.5px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;
    white-space:nowrap;
  }
  .tag.tt{background:#e7f0ea;color:var(--deep);border:1px solid #d2e3d8}
  .tag.comm{background:#f2f7ec;color:#5c7444;border:1px solid #e3edd8}
  .tag.live{
    background:var(--pistachio);color:var(--ink);
    display:inline-flex;align-items:center;gap:5px;
  }
  .tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--deep)}

  .stack{display:flex;align-items:center;gap:8px}
  .avs{display:flex}
  .av{
    width:25px;height:25px;border-radius:50%;
    display:grid;place-items:center;
    font-size:10px;font-weight:700;color:#fff;
    border:2px solid var(--white);
    margin-left:-8px;
    flex:none;
  }
  .av:first-child{margin-left:0}
  .av.you{background:var(--ink)}
  .joined-n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- detail ---------- */
  .detail{display:flex;flex-direction:column;height:100%;min-height:0}
  .back{
    display:flex;align-items:center;gap:7px;
    border:0;background:transparent;
    padding:13px 15px;
    font-size:13px;font-weight:600;color:var(--muted);
    border-bottom:1px solid var(--line-soft);
  }
  .back:hover{color:var(--eucalyptus)}
  .back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .detail-scroll{overflow-y:auto;padding:15px 17px 17px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
  .detail h2{
    margin:0;font-size:21px;line-height:1.2;letter-spacing:-.02em;
    font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;
    text-wrap:balance;
  }
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .desc{margin:0;font-size:14px;color:#33453d;line-height:1.6}
  .facts{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line-soft)}
  .fact{display:flex;gap:10px;align-items:flex-start;background:var(--white);padding:10px 12px}
  .fact svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:var(--jade);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .fact-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:1px}
  .fact-v{font-size:13.5px;font-weight:600;color:var(--ink)}
  .fact-v small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}

  .joinrow{display:flex;flex-direction:column;gap:10px}
  .btn{
    border:0;border-radius:999px;
    padding:13px 20px;
    font-size:14.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .16s,background .16s,color .16s;
    width:100%;
  }
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .btn.join{background:var(--grad);color:#fff;box-shadow:0 3px 12px rgba(15,92,76,.24)}
  .btn.join:hover{filter:brightness(1.06)}
  .btn.leave{background:var(--white);color:var(--eucalyptus);border:1.5px solid var(--line)}
  .btn.leave:hover{border-color:var(--eucalyptus)}

  .chat{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-soft);padding-top:14px}
  .chat-h{display:flex;align-items:center;gap:8px}
  .chat-h h3{margin:0;font-size:13.5px;font-weight:700;font-family:"Baloo 2",system-ui,sans-serif}
  .chat-h span{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .locked{
    background:var(--line-soft);
    border:1px dashed var(--line);
    border-radius:var(--r-md);
    padding:18px 16px;
    text-align:center;
    font-size:13px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:7px;
  }
  .locked svg{width:19px;height:19px;stroke:var(--faint);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .msgs{display:flex;flex-direction:column;gap:11px}
  .msg{display:flex;gap:9px}
  .msg .av{margin-left:0}
  .msg-b{display:flex;flex-direction:column;gap:2px;min-width:0}
  .msg-who{font-size:11.5px;font-weight:700;color:var(--eucalyptus)}
  .msg-who time{font-weight:500;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}
  .msg-t{
    background:var(--line-soft);
    border-radius:4px 13px 13px 13px;
    padding:8px 12px;
    font-size:13.5px;line-height:1.45;
    color:#22332c;
    overflow-wrap:anywhere;
  }
  .msg.mine .msg-t{background:#e6f2df;border-radius:13px 4px 13px 13px}
  .composer{display:flex;gap:8px;align-items:center}
  .composer input{
    flex:1;min-width:0;
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:11px 15px;
    font:inherit;font-size:13.5px;
    background:var(--white);color:var(--ink);
  }
  .composer input::placeholder{color:var(--faint)}
  .composer input:focus{outline:none;border-color:var(--jade)}
  .send{
    width:42px;height:42px;flex:none;
    border:0;border-radius:50%;
    background:var(--grad);color:#fff;
    display:grid;place-items:center;
  }
  .send svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .send:hover{filter:brightness(1.06)}

  .empty{
    padding:34px 20px;text-align:center;color:var(--muted);font-size:13.5px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .empty button{
    border:1.5px solid var(--line);background:var(--white);
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--eucalyptus);
  }
  .empty button:hover{border-color:var(--eucalyptus)}

  /* ---------- mobile ---------- */
  @media (max-width:900px){
    .body{grid-template-columns:1fr}
    .rail{
      position:static;
      max-height:none;
    }
    .rail-scroll{max-height:420px}
    .detail-scroll{max-height:none;overflow:visible}
    .canvas{aspect-ratio:1/1}
  }
  @media (max-width:520px){
    .shell{padding-block:12px 20px}
    .wordmark{font-size:29px}
    .filters{gap:8px}
    .seg button{padding:7px 12px;font-size:13px}
    .legend{left:10px;bottom:10px;padding:8px 10px;font-size:11px;gap:6px}
    .canvas{aspect-ratio:3/4}
  }
</style>
</head>
<body>


<div class="shell">
  <header>
    <div class="wordmark">rally</div>
    <div class="campus">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14.5s5-4.2 5-8a5 5 0 0 0-10 0c0 3.8 5 8 5 8Z"/><circle cx="8" cy="6.4" r="1.9"/></svg>
      Texas Tech University
    </div>
    <div class="spacer"></div>
    <span class="demo-chip">Demo data</span>
    <div class="me" title="You">JC</div>
  </header>

  <div class="filters">
    <div class="seg" role="group" aria-label="Filter by time">
      <button id="t-now" data-time="now" aria-pressed="false"><span class="livedot"></span>Now</button>
      <button id="t-later" data-time="later" aria-pressed="false">Later</button>
      <button id="t-all" data-time="all" aria-pressed="true">All times</button>
    </div>
    <div class="seg" role="group" aria-label="Filter by event type">
      <button id="s-all" data-source="all" aria-pressed="true">All events</button>
      <button id="s-official" data-source="official" aria-pressed="false">Texas Tech</button>
      <button id="s-community" data-source="community" aria-pressed="false">Community</button>
    </div>
    <div class="cats" id="cats" role="group" aria-label="Filter by category"></div>
  </div>

  <div class="body">
    <div class="mapwrap">
      <div class="canvas" id="canvas">
        <svg class="base" viewBox="0 0 800 600" aria-label="Stylized map of the Texas Tech University campus">
          <rect width="800" height="600" fill="#eaf3e4"/>

          <!-- green spaces -->
          <rect x="55" y="492" width="235" height="84" rx="34" fill="#d8ebc4"/>
          <rect x="600" y="440" width="170" height="120" rx="30" fill="#d8ebc4"/>
          <circle cx="380" cy="300" r="86" fill="#d8ebc4"/>

          <!-- roads -->
          <g stroke="#ffffff" stroke-linecap="round" fill="none">
            <path d="M0 150 H800" stroke-width="17"/>
            <path d="M0 470 H800" stroke-width="17"/>
            <path d="M0 300 H800" stroke-width="25"/>
            <path d="M380 0 V600" stroke-width="23"/>
            <path d="M170 0 V600" stroke-width="15"/>
            <path d="M600 0 V600" stroke-width="15"/>
          </g>
          <circle cx="380" cy="300" r="62" fill="none" stroke="#ffffff" stroke-width="21"/>
          <circle cx="380" cy="300" r="35" fill="#cfe6bb"/>

          <!-- buildings -->
          <g fill="#dce7d5" stroke="#cbdac2" stroke-width="1.5">
            <rect x="225" y="52" width="140" height="62" rx="6"/>
            <rect x="614" y="38" width="152" height="80" rx="12"/>
            <rect x="214" y="184" width="126" height="76" rx="6"/>
            <rect x="420" y="188" width="136" height="73" rx="6"/>
            <rect x="630" y="184" width="130" height="72" rx="6"/>
            <rect x="194" y="344" width="136" height="68" rx="6"/>
            <rect x="424" y="348" width="106" height="58" rx="6"/>
            <rect x="556" y="344" width="90" height="58" rx="6"/>
            <rect x="60" y="196" width="82" height="64" rx="6"/>
            <rect x="60" y="344" width="82" height="58" rx="6"/>
          </g>

          <!-- trees -->
          <g fill="#c3dfa8">
            <circle cx="90" cy="510" r="9"/><circle cx="120" cy="536" r="7"/><circle cx="158" cy="506" r="8"/>
            <circle cx="205" cy="534" r="7"/><circle cx="246" cy="508" r="9"/>
            <circle cx="646" cy="482" r="9"/><circle cx="686" cy="512" r="8"/><circle cx="726" cy="480" r="7"/>
            <circle cx="700" cy="546" r="9"/><circle cx="636" cy="536" r="7"/>
            <circle cx="330" cy="252" r="7"/><circle cx="440" cy="330" r="7"/>

      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        var input = document.getElementById('msgin');
        var val = input.value.trim();
        if (!val) return;
        if (!state.extraMsgs[e.id]) state.extraMsgs[e.id] = [];
        var d = new Date();
        var h = d.getHours(), mm = String(d.getMinutes()).padStart(2,'0');
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12; if (h === 0) h = 12;
        state.extraMsgs[e.id].push({who:'You', t:h + ':' + mm + ' ' + ampm, m:val});
        input.value = '';
        render();
        var box = document.getElementById('msgs');
        if (box) box.scrollIntoView({block:'end'});
        var again = document.getElementById('msgin');
        if (again) again.focus();
      });
    }
  }

  function render(){
    renderPins();
    var sel = state.selected ? EVENTS.filter(function(e){ return e.id === state.selected; })[0] : null;
    if (sel && visible().indexOf(sel) === -1) { state.selected = null; sel = null; }
    if (sel) renderDetail(sel); else renderList();
  }

  render();
})();
</script>

</body>
</html>
